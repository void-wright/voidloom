# The leak gate, server side: the same tools/leak_gate.py the git hooks run locally, on every push and
# pull request. A hook can be skipped with --no-verify; this cannot.
#
# The private denylist never ships. CI receives only the SHA-256 of each lower-cased term, in the
# VOIDLOOM_DENYLIST_SHA256 Actions secret, and matches text by hashing its word n-grams. Pull requests
# from forks get no secrets: they still get the personal-path, PII and secrets checks, and the push to
# main that merges them runs the full gate.
name: leak-gate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: leak-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks (pinned release, checked against its published checksums)
        env:
          GL_VERSION: "8.30.0"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}"
          curl -fsSLO "${base}/gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/gitleaks_${GL_VERSION}_checksums.txt"
          grep " gitleaks_${GL_VERSION}_linux_x64.tar.gz\$" "gitleaks_${GL_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GL_VERSION}_linux_x64.tar.gz" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: the whole tree
        env:
          VOIDLOOM_DENYLIST_SHA256: ${{ secrets.VOIDLOOM_DENYLIST_SHA256 }}
        run: |
          set -euo pipefail
          REQ=""
          # a push to the public repository must be checked against the private list; only a fork's PR may skip it
          if [ "${{ github.event_name }}" = "push" ]; then REQ="--require-denylist"; fi
          python3 tools/leak_gate.py --tree $REQ

      - name: the commits being added (identities, messages, added lines)
        env:
          VOIDLOOM_DENYLIST_SHA256: ${{ secrets.VOIDLOOM_DENYLIST_SHA256 }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || [ -z "${{ github.event.before }}" ] \
               || ! git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            # a new ref, or a rewrite whose old head is no longer in the history: scan everything the new head reaches
            RANGE="${{ github.sha }}"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          python3 tools/leak_gate.py --range "$RANGE"
